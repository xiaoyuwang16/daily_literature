alert:
  title: "Daily PLM-PPI Literature Alert"
  project_context: >
    We are interested in protein language models for protein-protein interaction
    interpretation, partner-conditioned embedding shifts, sparse autoencoder
    features, AlphaFold-Multimer limitations, proximity labeling, PUP-IT, and
    functional vs physical interaction continua.

sources:
  pubmed:
    queries:
      - '("protein language model" OR "protein language models") AND ("protein-protein interaction" OR interface OR binding)'
      - '("protein language model" OR "protein language models" OR ESM OR "evolutionary scale modeling") AND ("representation learning" OR embedding OR embeddings OR "sequence representation")'
      - '(ESM OR ESM2 OR "ESM-2" OR "evolutionary scale modeling" OR ProtT5 OR ProGen) AND protein'
      - '("sparse autoencoder" OR "interpretable feature" OR "mechanistic interpretability") AND protein'
      - '("AlphaFold-Multimer" OR "AlphaFold Multimer") AND ("protein-protein interaction" OR interface OR screening)'
      - '("proximity labeling" OR "PUP-IT" OR "pupylation-based interaction tagging" OR TurboID OR BioID) AND protein'
  arxiv:
    queries:
      - 'all:"protein language model" AND all:"protein-protein interaction"'
      - 'all:"protein language model" AND all:"representation learning"'
      - 'all:"evolutionary scale modeling" AND all:"protein"'
      - 'all:"ESM" AND all:"protein"'
      - 'all:"protein language model" AND all:"sparse autoencoder"'
      - 'all:"AlphaFold-Multimer" AND all:"protein-protein interaction"'
      - 'all:"proximity labeling" AND all:"protein"'
  openalex:
    queries:
      - 'protein language model protein-protein interaction'
      - 'protein language model representation learning protein sequence'
      - 'evolutionary scale modeling protein'
      - 'ESM protein language model'
      - 'protein embeddings structure function'
      - 'protein language model sparse autoencoder'
      - 'partner-conditioned protein language model'
      - 'AlphaFold-Multimer protein interaction screening'
      - 'PUP-IT proximity labeling protein interaction'
  biorxiv:
    enabled: true
  medrxiv:
    enabled: true

